{% extends 'base.html' %}

{% block title %}403 - Access Forbidden – InternWorld{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="custom-card p-5">
                <div class="display-1 fw-bold text-danger mb-3">403</div>
                <h3 class="fw-bold mb-2">Access Restricted</h3>
                <p class="text-muted mb-4">
                    You do not have the required role permissions to view or interact with this resource.
                </p>
                <a href="{% url 'accounts:dashboard_redirect' %}" class="btn btn-primary-custom px-4 py-2">
                    <i class="bi bi-speedometer2 me-1"></i> Go to My Dashboard
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
