{% extends 'base.html' %}

{% block title %}500 - Server Error – InternWorld{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="custom-card p-5">
                <div class="display-1 fw-bold text-warning mb-3">500</div>
                <h3 class="fw-bold mb-2">Unexpected Server Error</h3>
                <p class="text-muted mb-4">
                    Something went wrong on our end. Our engineering team has been notified.
                </p>
                <a href="{% url 'opportunities:home' %}" class="btn btn-primary-custom px-4 py-2">
                    <i class="bi bi-house-door-fill me-1"></i> Return Home
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
