{% extends 'base.html' %}

{% block title %}404 - Page Not Found – InternWorld{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="custom-card p-5">
                <div class="display-1 fw-bold text-primary mb-3">404</div>
                <h3 class="fw-bold mb-2">Opportunity or Page Not Found</h3>
                <p class="text-muted mb-4">
                    The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.
                </p>
                <a href="{% url 'opportunities:home' %}" class="btn btn-primary-custom px-4 py-2">
                    <i class="bi bi-house-door-fill me-1"></i> Return Home
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
