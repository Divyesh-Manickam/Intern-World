{% extends 'base.html' %}

{% block title %}Email Sent - InternWorld{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="custom-card p-4 p-md-5 text-center">
                <div class="bg-success-subtle text-success rounded-circle d-inline-flex p-3 mb-3">
                    <i class="bi bi-envelope-check-fill fs-3"></i>
                </div>
                <h3 class="fw-bold">Check Your Email</h3>
                <p class="text-muted small mb-4">We've emailed you instructions for setting your password, if an account exists with the email you entered. You should receive them shortly.</p>
                
                <a href="{% url 'accounts:login' %}" class="btn btn-outline-primary-custom w-100 py-2">
                    Back to Login
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
