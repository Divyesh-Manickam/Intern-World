{% extends 'base.html' %}

{% block title %}Password Reset Complete - InternWorld{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="custom-card p-4 p-md-5 text-center">
                <div class="bg-success-subtle text-success rounded-circle d-inline-flex p-3 mb-3">
                    <i class="bi bi-check-circle-fill fs-3"></i>
                </div>
                <h3 class="fw-bold">Password Reset Complete</h3>
                <p class="text-muted small mb-4">Your password has been set. You may go ahead and log in now.</p>
                
                <a href="{% url 'accounts:login' %}" class="btn btn-primary-custom w-100 py-2">
                    Sign In
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
